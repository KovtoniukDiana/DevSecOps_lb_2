[extend]
useDefault = true          # залишаємо всі стандартні правила

[[rules]]
id = "dragon-clinic-db-password"
description = "Пароль до бази медичних карток у рядку підключення dragondb://"
# Група 1 — лише пароль. Пароль: 8+ символів ASCII (літери, цифри, %._~!$&*+=-).
# Заглушка <пароль> не збігається (символів < і > немає в наборі), рядок без пароля теж.
regex = '''dragondb://[^\s:@/]+:([A-Za-z0-9%._~!$&*+=-]{8,})@[^\s/]+/\S+'''
secretGroup = 1
keywords = ["dragondb://"]  # швидкий попередній фільтр

[allowlist]
description = "Документація з прикладами"
paths = ['''docs/examples/.*''']
